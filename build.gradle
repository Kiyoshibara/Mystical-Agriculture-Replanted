
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'com.blakebr0.mysticalagriculture'

base {
    archivesName = "Mystical-Agriculture-Replanted-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

repositories {
    mavenLocal {
        content {
            includeModule 'com.blakebr0.cucumber', 'Cucumber'
        }
    }

    maven { url 'https://maven.blamejared.com' }
    maven { url 'https://maven.tterrag.com' }

    maven {
        url 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

tasks.register('syncTestDatapacks', Sync) {
    if (file('run/saves').exists()) {
        file('run/saves').eachDir { dir ->
            project.sync {
                from 'src/test/resources/datapacks'
                into file(dir.path + '/datapacks')
            }
        }
    }

    project.sync {
        from 'src/test/resources/datapacks'
        into file('run/world/datapacks')
    }
}

tasks.register('syncTestScripts', Sync) {
    from 'src/test/resources/scripts'
    into 'run/scripts'
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }

        server {
            server()
        }

        data {
            clientData()

            programArguments.addAll '--mod',
                    'mysticalagriculture',
                    '--all',
                    '--output',
                    file('src/generated/resources/').getAbsolutePath(),
                    '--existing',
                    file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'terminal.jline', 'true'
            logLevel = org.slf4j.event.Level.DEBUG
            ideName = "MysticalAgriculture - ${it.ideName.get()}"

            taskBefore tasks.named('syncTestDatapacks')
            taskBefore tasks.named('syncTestScripts')
        }
    }

    mods {
        mysticalagriculture {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

sourceSets.main.resources {
    srcDirs 'src/generated/resources'
    exclude '.cache'
    exclude '**/.cache/**'
    exclude '**/*.bak'
}

dependencies {
    implementation "com.blakebr0.cucumber:Cucumber:${cucumber_version}"

    implementation "curse.maven:jade-324717:${jade_version}"

    // Patchouli integration is temporarily disabled
    // due to Minecraft 26.3 incompatibility.
    // runtimeOnly "vazkii.patchouli:patchouli-neoforge:${patchouli_version}"

    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
}

java.withSourcesJar()

tasks.register('apiJar', Jar) {
    from(sourceSets.main.output) {
        include 'com/blakebr0/mysticalagriculture/api/**'
    }

    archiveClassifier = 'api'
}

artifacts {
    archives apiJar
}

tasks.withType(ProcessResources).configureEach {
    exclude '**/*.bak'
    exclude '**/.cache/**'

    var replaceProperties = [
        mod_version: project.version.toString(),
        cucumber_version: cucumber_version
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.withType(Jar).configureEach {
    exclude '**/*.bak'
    exclude '**/.cache/**'

    from('LICENSE') {
        into('META-INF')
    }
}
