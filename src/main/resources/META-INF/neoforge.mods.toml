[[mods]]

    modId="mysticalagriculture"
    version="${mod_version}"
    displayName="Mystical Agriculture: Replanted"

    displayURL="https://www.curseforge.com/minecraft/mc-mods/mystical-agriculture-replanted"
    # logoFile="examplemod.png"
    authors="BlakeBr0 (Original), Kiyoshibara (Unofficial Port)"
    credits="Original mod and code by BlakeBr0 and contributors."

    logoFile="port_logo.png"
    description='''
    Grow resources, craft powerful equipment, and automate resource production through magical agriculture. Unofficial NeoForge 26.3 port.
    Support this unofficial port on Patreon: https://www.patreon.com/c/Kiyoshibara
    '''
    [[dependencies.mysticalagriculture]]
        modId="neoforge"
        mandatory=true
        versionRange="[26.3.0.115,)"
        ordering="NONE"
        side="BOTH"
    [[dependencies.mysticalagriculture]]
        modId="minecraft"
        mandatory=true
        versionRange="[26.3,26.4)"
        ordering="NONE"
        side="BOTH"
    [[dependencies.mysticalagriculture]]
        modId="cucumber"
        mandatory=true
        versionRange="[${cucumber_version},)"
        ordering="NONE"
        side="BOTH"